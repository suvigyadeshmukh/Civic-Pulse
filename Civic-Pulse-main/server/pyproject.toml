[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civicpulse-server"
version = "0.1.0"
description = "Civic Pulse — Digital Governance & Public Information Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Civic Pulse Infrastructure & Core Lead", email = "infra@civicpulse.gov" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.3.0",
    "edge-tts>=6.1.12",
    "playwright>=1.44.0",
    "c2pa-python>=0.6.0",
    "imagehash>=4.3.1",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "types-redis>=4.6.0",
    "types-boto3>=1.34.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "integration: requires live PostgreSQL, Redis, or MinIO services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py311']

