# ==============================================================================
# Civic Pulse — Alembic Migration Configuration (server/alembic.ini)
# ==============================================================================

[alembic]
# Path to migration scripts (relative to server directory)
script_location = migrations

# Migration template name pattern
file_template = %%(rev)s_%%(slug)s

# Prepend current directory to sys.path so 'app' package imports work cleanly
prepend_sys_path = .

# Timezone for generated migration timestamps
timezone = UTC

# Max length of characters to apply to the slug field in migration names
truncate_slug_length = 40

# Output encoding for --sql mode
output_encoding = utf-8

# Default database URL (overridden dynamically in migrations/env.py via settings)
sqlalchemy.url = postgresql+psycopg2://civicpulse:civicpulse_secret@localhost:5432/civicpulse_db

[post_write_hooks]
# Post-write formatting hook can be enabled when code formatters are configured
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

